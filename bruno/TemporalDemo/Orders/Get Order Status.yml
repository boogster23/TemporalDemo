info:
  name: Get Order Status
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/orders/{{lastOrderId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.orderId
      operator: eq
      value: "{{lastOrderId}}"
    - expression: res.body.currentState
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

